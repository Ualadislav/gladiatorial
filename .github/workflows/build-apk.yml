name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0 platform-tools

      - name: Install dependencies
        run: npm ci --ignore-scripts=false

      - name: Build web + sync Capacitor
        run: npm run build:apk-assets

      - name: Point Gradle at SDK
        run: echo "sdk.dir=$ANDROID_HOME" > apps/web/android/local.properties

      - name: Assemble debug APK
        working-directory: apps/web/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Pack APK for download
        run: |
          mkdir -p release
          cp apps/web/android/app/build/outputs/apk/debug/app-debug.apk release/Gladiators-debug.apk
          ls -lah release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gladiators-debug-apk
          path: release/Gladiators-debug.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Gladiators APK #${{ github.run_number }}
          files: release/Gladiators-debug.apk
          generate_release_notes: false
          body: |
            Debug APK для установки на Android.
            Скачай `Gladiators-debug.apk` и установи на телефон.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
