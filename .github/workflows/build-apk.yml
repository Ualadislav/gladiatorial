name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0 platform-tools

      - name: Install dependencies
        run: npm ci --ignore-scripts=false

      - name: Build web + sync Capacitor
        run: npm run build:apk-assets

      - name: Point Gradle at SDK
        run: echo "sdk.dir=$ANDROID_HOME" > apps/web/android/local.properties

      - name: Assemble debug APK
        working-directory: apps/web/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gladiators-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
